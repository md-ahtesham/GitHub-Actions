name: Installing python
on:
  workflow_dispatch:
jobs:
  python_installation:
    runs-on: ubuntu-latest
    steps:
      - name: clone the repo
        uses: actions/checkout@v4
      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: check python version
        run: python --version
